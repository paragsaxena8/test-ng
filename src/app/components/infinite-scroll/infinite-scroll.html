<section class="mx-auto w-full max-w-5xl p-4 md:p-6">
    <header class="mb-4">
        <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">Infinite Scroll</h1>
        <p class="mt-1 text-sm text-slate-600 dark:text-slate-300">
            Virtualized list with incremental loading for smooth performance.
        </p>
    </header>

    <cdk-virtual-scroll-viewport
        class="h-[28rem] rounded-xl border border-slate-200 bg-white dark:border-slate-700 dark:bg-slate-900"
        [itemSize]="itemSize"
        [minBufferPx]="minBufferPx"
        [maxBufferPx]="maxBufferPx"
        (scrolledIndexChange)="onScrolledIndexChange($event)"
    >
        <div
            *cdkVirtualFor="let item of items; trackBy: trackByValue"
            class="flex h-14 items-center justify-between border-b border-slate-100 px-4 text-sm text-slate-700 last:border-b-0 dark:border-slate-800 dark:text-slate-200"
        >
            <span>Item {{ item }}</span>
            <span class="text-xs text-slate-400 dark:text-slate-500">#{{ item }}</span>
        </div>
    </cdk-virtual-scroll-viewport>
</section>
